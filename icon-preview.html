<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Preview Icono Com2IT</title>
  <style>
    body { background: #0B1120; display:flex; flex-wrap:wrap; gap:20px; align-items:center; justify-content:center; min-height:100vh; margin:0; font-family:Arial,sans-serif; }
    .card { background:#131D33; border:1px solid #273553; border-radius:12px; padding:20px; text-align:center; color:#94A3B8; font-size:13px; }
    .card img { display:block; margin:0 auto 10px; }
    h1 { color:#F59E0B; font-size:14px; margin:0 0 8px 0; }
  </style>
</head>
<body>
  <div class="card">
    <h1>SVG (cualquier tamaño)</h1>
    <img src="assets/icons/icon.svg" width="192" height="192" alt="Icono SVG">
    <p>icon.svg</p>
  </div>
  <div class="card">
    <h1>PNG 192x192</h1>
    <img src="icon-192.png" width="192" height="192" alt="Icono 192">
    <p>icon-192.png</p>
  </div>
  <div class="card">
    <h1>PNG 512x512 (escalado al 50%)</h1>
    <img src="icon-512.png" width="256" height="256" alt="Icono 512">
    <p>icon-512.png</p>
  </div>
  <div class="card">
    <h1>Apariencia en pantalla pequeña (48px)</h1>
    <img src="assets/icons/icon.svg" width="48" height="48" alt="Mini">
    <p>48x48 (launcher móvil)</p>
  </div>
</body>
</html>
