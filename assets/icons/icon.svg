<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Degradados Institucionales -->
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991B1B" />
      <stop offset="50%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#7F1D1D" />
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="cyanTech" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>
    <!-- Filtro de Sombra -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Fondo circular oscuro opcional para contraste -->
  <rect width="512" height="512" rx="100" fill="#0A0F1D" />

  <!-- Escudo Institucional Exterior (Borde Dorado) -->
  <path d="M 256,40 
           C 360,40 430,70 430,150 
           C 430,290 350,390 256,460 
           C 162,390 82,290 82,150 
           C 82,70 152,40 256,40 Z" 
        fill="url(#goldBorder)" 
        filter="url(#dropShadow)" />

  <!-- Escudo Interior (Rojo Institucional) -->
  <path d="M 256,56 
           C 346,56 412,82 412,152 
           C 412,278 340,372 256,438 
           C 172,372 100,278 100,152 
           C 100,82 166,56 256,56 Z" 
        fill="url(#shieldBg)" />

  <!-- Circuito / Pistas de red en el escudo superior -->
  <g stroke="#FDE047" stroke-width="3" stroke-linecap="round" opacity="0.35" fill="none">
    <path d="M 170,120 L 210,120 L 230,140" />
    <circle cx="170" cy="120" r="4" fill="#FDE047" />
    <path d="M 342,120 L 302,120 L 282,140" />
    <circle cx="342" cy="120" r="4" fill="#FDE047" />
    <path d="M 256,70 L 256,110" />
    <circle cx="256" cy="70" r="4" fill="#FDE047" />
  </g>

  <!-- Engranaje Central Tecnológico (Detrás del Monitor) -->
  <g transform="translate(256, 230)" fill="#F59E0B" opacity="0.9">
    <path d="M -16,-62 L 16,-62 L 20,-48 C 28,-44 36,-39 42,-32 L 56,-36 L 78,-14 L 74,0 C 76,9 76,18 74,27 L 88,41 L 66,63 L 52,59 C 45,66 37,71 29,75 L 25,89 L -7,89 L -11,75 C -19,71 -27,66 -34,59 L -48,63 L -70,41 L -66,27 C -68,18 -68,9 -66,0 L -80,-14 L -58,-36 L -44,-32 C -38,-39 -30,-44 -22,-48 Z" />
    <circle cx="0" cy="13" r="38" fill="#7F1D1D" />
  </g>

  <!-- Pantalla / Monitor de Computadora -->
  <g transform="translate(146, 150)">
    <!-- Marco de Pantalla -->
    <rect x="0" y="0" width="220" height="150" rx="14" fill="#1E293B" stroke="#FDE047" stroke-width="4" filter="url(#dropShadow)" />
    <!-- Panel / Display -->
    <rect x="12" y="12" width="196" height="114" rx="8" fill="url(#screenGrad)" />
    <!-- Líneas de consola de soporte y estado -->
    <text x="24" y="38" font-family="Courier New, monospace" font-size="14" font-weight="bold" fill="#4ADE80">&gt; COM2_IT: ONLINE</text>
    <text x="24" y="58" font-family="Courier New, monospace" font-size="12" fill="#FDE047">SALA 1 | SALA 2 | SALA 3</text>
    <path d="M 24,72 L 180,72" stroke="#334155" stroke-width="2" />
    <!-- Gráfica de pulso tecnológico en pantalla -->
    <path d="M 24,96 L 60,96 L 75,76 L 90,110 L 105,86 L 120,96 L 184,96" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Pie del monitor -->
    <rect x="94" y="150" width="32" height="26" fill="#334155" />
    <path d="M 70,176 L 150,176 C 153,176 156,179 154,182 L 150,186 L 70,186 L 66,182 C 64,179 67,176 70,176 Z" fill="#F59E0B" />
  </g>

  <!-- Cinta / Cartela Inferior "COM 2" -->
  <g transform="translate(256, 395)">
    <path d="M -110,-18 L 110,-18 C 120,-18 128,-10 125,0 L 115,22 C 112,28 104,32 95,32 L -95,32 C -104,32 -112,28 -115,22 L -125,0 C -128,-10 -120,-18 -110,-18 Z" 
          fill="#111827" stroke="#FDE047" stroke-width="3" />
    <text x="0" y="14" font-family="Arial Black, Impact, sans-serif" font-size="24" font-weight="900" fill="#FDE047" text-anchor="middle" letter-spacing="3">COM 2 • IT</text>
  </g>

  <!-- Insignia Subtítulo Piso Tecnológico -->
  <text x="256" y="482" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#94A3B8" text-anchor="middle" letter-spacing="2">PISO TECNOLÓGICO</text>
</svg>
